name: Test

on:
  pull_request:

permissions: {}

jobs:
  pre-commit:
    permissions:
      contents: read
    uses: radiorabe/actions/.github/workflows/test-pre-commit.yaml@6373540d4ab86c4ce044b6a67e96aecddf22c7c9 # v0.45.1
  python-poetry:
    permissions:
      contents: read
    uses: radiorabe/actions/.github/workflows/test-python-poetry.yaml@6373540d4ab86c4ce044b6a67e96aecddf22c7c9 # v0.45.1
    with:
      version: '3.12'
  github-actions:
    permissions:
      contents: read
      security-events: write # so zizmor can publish results to the Security tab
    uses: radiorabe/actions/.github/workflows/test-github-actions.yaml@6373540d4ab86c4ce044b6a67e96aecddf22c7c9 # v0.45.1
  helm-chart:
    name: Test Helm Chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build dev image
        run: |
          docker build -t ghcr.io/radiorabe/catpage:latest -f Dockerfile .
          docker save -o /tmp/catpage.tar ghcr.io/radiorabe/catpage:latest

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.11.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Install chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct --config=.github/ct.yaml list-changed)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Run chart-testing (lint)
        run: ct --config=.github/ct.yaml lint

      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1

      - name: Load dev image
        run: |
          kind load image-archive /tmp/catpage.tar --name chart-testing

      - name: Run chart-testing (install)
        run: ct --config=.github/ct.yaml install
